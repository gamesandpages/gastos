<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis gastos del mes</title>
    <meta name="description" content="Anota tus gastos y mira cuánto llevas gastado en el mes.">
    <!-- Color de la barra de arriba del navegador en el celular -->
    <meta name="theme-color" content="#0e7466">
    <!-- Ícono de la pestaña: un dibujo SVG escrito directo aquí, sin archivo aparte -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e7466'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3E%E2%82%A1%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="contenedor">
        <h1>Mis gastos del mes</h1>
        <section class="tarjeta">
            <h2>Resumen</h2>

            <label for="mes">Mes</label>
            <input type="month" id="mes" required>

            <div class="totales">
                <div class="total">
                    <span class="total-etiqueta">Colones</span>
                    <span id="total-CRC" class="total-numero">₡0</span>
                    <div id="barra-CRC" class="barra" hidden><div class="barra-relleno"></div></div>
                    <span id="texto-CRC" class="barra-texto"></span>
                </div>
                <div class="total">
                    <span class="total-etiqueta">Dólares</span>
                    <span id="total-USD" class="total-numero">$0</span>
                    <div id="barra-USD" class="barra" hidden><div class="barra-relleno"></div></div>
                    <span id="texto-USD" class="barra-texto"></span>
                </div>
            </div>

            <h3>Por categoría</h3>
            <p id="sin-categorias" class="vacio">Sin gastos en este mes.</p>
            <table id="tabla-categorias" class="tabla">
                <thead>
                    <tr><th>Categoría</th><th>₡</th><th>$</th></tr>
                </thead>
                <tbody id="cuerpo-categorias"></tbody>
            </table>
        </section>

        <form id="form-gasto" class="tarjeta">
            <h2>Nuevo gasto</h2>

            <label for="monto">Monto</label>
            <input type="number" id="monto" min="0.01" step="0.01" placeholder="Ej: 2500" required>

            <label for="moneda">Moneda</label>
            <select id="moneda">
                <option value="CRC">Colones (₡)</option>
                <option value="USD">Dólares ($)</option>
            </select>

            <label for="categoria">Categoría</label>
            <select id="categoria">
                <option>Comida</option>
                <option>Transporte</option>
                <option>Casa</option>
                <option>Servicios</option>
                <option>Ocio</option>
                <option>Otros</option>
            </select>

            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" required>

            <button type="submit">Agregar</button>
        </form>

        <section class="tarjeta">
            <h2>Mis gastos</h2>
            <p id="sin-gastos" class="vacio">No hay gastos en este mes.</p>
            <ul id="lista-gastos" class="lista"></ul>
        </section>

        <form id="form-presupuesto" class="tarjeta">
            <h2>Presupuesto mensual</h2>
            <p class="vacio">Sirve para todos los meses. Déjalo vacío si no quieres presupuesto en esa moneda.</p>

            <label for="presupuesto-CRC">En colones (₡)</label>
            <input type="number" id="presupuesto-CRC" min="0" step="0.01" placeholder="Sin presupuesto">

            <label for="presupuesto-USD">En dólares ($)</label>
            <input type="number" id="presupuesto-USD" min="0" step="0.01" placeholder="Sin presupuesto">

            <button type="submit">Guardar presupuesto</button>
            <p id="presupuesto-guardado" class="mensaje-ok" hidden>Presupuesto guardado.</p>
        </form>
    </main>
    <script src="app.js"></script>
</body>
</html>
