<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis gastos del mes</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="contenedor">
        <h1>Mis gastos del mes</h1>
        <form id="form-gasto" class="tarjeta">
            <h2>Nuevo gasto</h2>

            <label for="monto">Monto</label>
            <input type="number" id="monto" min="0.01" step="0.01" placeholder="Ej: 2500" required>

            <label for="moneda">Moneda</label>
            <select id="moneda">
                <option value="CRC">Colones (₡)</option>
                <option value="USD">Dólares ($)</option>
            </select>

            <label for="categoria">Categoría</label>
            <select id="categoria">
                <option>Comida</option>
                <option>Transporte</option>
                <option>Casa</option>
                <option>Servicios</option>
                <option>Ocio</option>
                <option>Otros</option>
            </select>

            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" required>

            <button type="submit">Agregar</button>
        </form>

        <section class="tarjeta">
            <h2>Mis gastos</h2>
            <p id="sin-gastos" class="vacio">Todavía no anotaste ningún gasto.</p>
            <ul id="lista-gastos" class="lista"></ul>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
